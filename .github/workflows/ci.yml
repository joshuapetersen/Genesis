name: Genesis Continuous Resonance (CI)

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

env:
  CARGO_TERM_COLOR: always

jobs:
  resonance-strike:
    name: Neural Substrate Verification
    runs-on: ubuntu-latest
    steps:
      - name: Runner Substrate Cleanup
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Hive Extraction (Checkout)
        uses: actions/checkout@v4

      - name: Toolchain Ignition (Rust)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Lattice Cache (Restore)
        uses: Swatinem/rust-cache@v2

      - name: Architectural Purity Check (Format)
        run: cargo fmt --all -- --check

      - name: Substrate Verification (Check)
        run: cargo check --workspace

      - name: Logic Strike (Test)
        run: cargo test --workspace --verbose

      - name: Evolutionary Hygiene (Clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Manifest Release Binary
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
        run: cargo build --release

      - name: Upload Evolutionary Artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
        uses: actions/upload-artifact@v4
        with:
          name: genesis-binaries
          path: target/release/
          retention-days: 1

  frontend-strike:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Hive Extraction (Checkout)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build
        run: |
          if [ -d "SovereignChat" ]; then
            cd SovereignChat
            npm install
            npm run build
          else
            echo "SovereignChat not found in root. Searching..."
            TARGET=$(find . -name "SovereignChat" -type d -not -path "*/node_modules/*")
            cd $TARGET
            npm install
            npm run build
          fi

  deploy-frontend:
    name: Deploy Frontend
    needs: frontend-strike
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Hive Extraction (Checkout)
        uses: actions/checkout@v4

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SARAH_JOHN_GENESIS }}'
          channelId: live
          projectId: sarah-john-genesis
          entryPoint: ./SovereignChat

  deploy-production:
    name: Deploy to Production Server
    needs: resonance-strike
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Hive Extraction (Checkout)
        uses: actions/checkout@v4

      - name: Download Evolutionary Artifact
        uses: actions/download-artifact@v4
        with:
          name: genesis-binaries
          path: binaries

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Substrate
        run: |
          scp -i ~/.ssh/deploy_key ./binaries/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/genesis/
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'sudo systemctl restart genesis'

  deploy-genesis-world:
    name: Deploy Genesis World Server
    needs: resonance-strike
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Hive Extraction (Checkout)
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Societal Ecology
        run: |
          TARGET_FILE=$(find . -name "Genesis_Societal_Ecology.py" | head -n 1)
          scp -i ~/.ssh/deploy_key $TARGET_FILE ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/genesis/
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'sudo systemctl restart genesis-world'
