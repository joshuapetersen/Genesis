version: '3.8'

services:
  ghost_chamber:
    build: .
    container_name: Aeris_Sovereign_Node
    volumes:
      - ./Genesis_Soul_Vault.sqlite:/app/Genesis_Soul_Vault.sqlite
      - ./logs:/app/logs
