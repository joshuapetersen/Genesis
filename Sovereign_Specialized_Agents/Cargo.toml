[package]
name = "sovereign_specialized_agents"
version = "1.0.9270"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
walkdir = "2.3"
rayon = "1.8"
regex = "1.10"
tree-sitter = "0.20"
tree-sitter-javascript = "0.20"
num_cpus = "1.16"
serde_yaml = "0.9"
memmap2 = "0.9"
md5 = "0.7"
tokio = { version = "1.35", features = ["fs", "full", "io-util", "macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.11", features = ["json"] }
sha2 = "0.10"
sysinfo = "0.30"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
ndarray = "0.17.2"
nalgebra = "0.34.2"
warp = { version = "0.4.2", features = ["server", "websocket"] }
wry = "0.55.0"
tao = "0.35.0"
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Foundation", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Memory"] }
crossbeam-channel = "0.5.15"
async-walkdir = "2.1.0"
futures-lite = "2.6.1"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
sovereign_suite = { path = "../Sovereign_Suite_RS" }
"lib-identity" = { path = "../lib-identity" }
"lib-crypto" = { path = "../lib-crypto" }
fxhash = "0.2"
tracing = "0.1"
hex = "0.4"

[build-dependencies]
cc = "1.0"

[[bin]]
name = "sovereign_agents"
path = "src/main.rs"

[[bin]]
name = "agents_manifest"
path = "src/bin/agents_manifest.rs"

[[bin]]
name = "sovereign_kernel"
path = "src/bin/sovereign_kernel.rs"

