[package]
name = "sovereign_orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
futures = "0.3"
sovereign_voice = { path = "../sovereign_voice" }
local-ip-address = "0.5"
axum = { version = "0.7", features = ["ws"] }
sarah_reasoning = { path = "../sarah_reasoning" }
sovereign_math = { path = "../Sovereign_Math" }
sovereign_hdc = { path = "../sovereign_hdc" }
sovereign_hive = { path = "../sovereign_hive" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["fs", "cors"] }
tower = { version = "0.4", features = ["limit", "buffer"] }
reqwest = { version = "0.11", features = ["json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-stream = "0.3"
dashmap = "5.5"
colored = "2.0"
chrono = "0.4"
winapi = { version = "0.3", features = ["processthreadsapi", "winbase"] }
core_affinity = "0.8"
uuid = { version = "1.0", features = ["v4"] }
dab_industries = { path = "../dab_industries" }
