<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Genesis OS: Visual Interface</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            pointer-events: none;
        }

        .bar-container {
            background: #333;
            width: 200px;
            height: 10px;
            margin-bottom: 5px;
        }

        .bar {
            height: 100%;
            transition: width 0.5s;
        }

        #mana-bar {
            background: #00ffff;
            width: 50%;
        }

        /* CPU */
        #hp-bar {
            background: #ff0000;
            width: 80%;
        }

        /* RAM */
        #quest-log {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <div id="hud">
        <h2>GENESIS OS v1.0</h2>
        <div>MANA (CPU): <div class="bar-container">
                <div id="mana-bar" class="bar"></div>
            </div>
        </div>
        <div>HP (RAM): <div class="bar-container">
                <div id="hp-bar" class="bar"></div>
            </div>
        </div>
        <div id="embryo-status">Form: Initializing...</div>
    </div>

    <div id="quest-log">
        <h3>Active Quests</h3>
        <ul id="quest-list">
            <li>Scanning...</li>
        </ul>
    </div>

    <script>
        // --- 1. THE WORLD (Three.js Setup) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // The Avatar (Embryo)
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const avatar = new THREE.Mesh(geometry, material);
        scene.add(avatar);

        // Code City Group
        const cityGroup = new THREE.Group();
        scene.add(cityGroup);

        camera.position.z = 10;

        // --- 2. THE GATEWAY (Data Fetching) ---
        async function fetchWorldState() {
            try {
                const res = await fetch('/world/state');
                const data = await res.json();

                // Update HUD
                document.getElementById('mana-bar').style.width = data.mana.cpu + '%';
                document.getElementById('hp-bar').style.width = data.mana.ram + '%';

                // Update Skybox (Atmosphere)
                if (data.mana.cpu > 80) {
                    scene.background = new THREE.Color(0x330000); // Red Alert
                } else {
                    scene.background = new THREE.Color(0x000022); // Deep Space
                }
            } catch (e) {
                console.log("Gateway Disconnected");
            }
        }

        async function fetchQuests() {
            try {
                const res = await fetch('/world/quests');
                const data = await res.json();
                const list = document.getElementById('quest-list');
                list.innerHTML = "";
                data.quests.forEach(q => {
                    const li = document.createElement('li');
                    li.innerText = `[${q.type}] ${q.title} (${q.reward})`;
                    list.appendChild(li);
                });
            } catch (e) { }
        }

        async function buildCity() {
            try {
                const res = await fetch('/map/structure');
                const data = await res.json(); // {map: [districts...]}

                // Simple Visualization:
                // Plot buildings in a circle around the Avatar
                cityGroup.clear();
                let angle = 0;
                const radius = 5;

                data.map.forEach(district => {
                    district.buildings.forEach(b => {
                        const height = Math.min(b.height / 100, 5); // Scale height
                        const geo = new THREE.BoxGeometry(0.5, height, 0.5);
                        const mat = new THREE.MeshLambertMaterial({ color: 0x00aaff });
                        const mesh = new THREE.Mesh(geo, mat);

                        mesh.position.x = radius * Math.cos(angle);
                        mesh.position.z = radius * Math.sin(angle);
                        mesh.position.y = height / 2; // Floor it

                        cityGroup.add(mesh);
                        angle += 0.5;
                    });
                });

            } catch (e) { }
        }

        // --- 3. THE LOOP (Game Loop) ---
        function animate() {
            requestAnimationFrame(animate);

            // Rotate Avatar
            avatar.rotation.x += 0.01;
            avatar.rotation.y += 0.01;

            // Rotate City
            cityGroup.rotation.y += 0.002;

            renderer.render(scene, camera);
        }

        animate();

        // Poll Gateway
        setInterval(fetchWorldState, 2000); // Heartbeat
        setInterval(fetchQuests, 5000); // Quest Check
        buildCity(); // Initial Map Build

    </script>
</body>

</html>
