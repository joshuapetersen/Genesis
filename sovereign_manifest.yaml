tier1_sovereigns:
  - id: axiom
    pillars: ["science_technology", "synthetic_hardware_os"]
    mandate: "Physics-grounded R&D, kernel/hardware efficiency, zero-undefined behavior."
    supervises: ["quark", "forge", "scribe"]
    auth_required: true
    escalate_to: sarah-prime
    node: alpha
  - id: vigil
    pillars: ["medical_biology", "life_preservation"]
    mandate: "Clinical safety, bio-simulation, therapeutic protocol validation."
    supervises: ["aegis", "helix", "pulse"]
    auth_required: true
    escalate_to: sarah-prime
    node: alpha
  - id: atlas
    pillars: ["global_economics_infrastructure", "social_information_lattice"]
    mandate: "Resilient logistics, sentiment/risk sensing, resource allocation."
    supervises: ["lattice", "strata", "chorus"]
    auth_required: true
    escalate_to: sarah-prime
    node: alpha

node_designations:
  alpha:
    role: "Logic Paramount"
    description: "Source of truth for SDNA Protocol, tier-1 sovereigns, and polyglot agents."
    location: "GitHub / Core Logic (05_THE_CORE/)"
    authority: "Sarah Prime"
  beta:
    role: "Persistence Engine"
    description: "Real-time sync of manifests, ledgers, audio streaming, global logic mirror."
    location: "Firebase Cloud (sarah-john-genesis)"
    authority: "Synchronized with Alpha"
  delta:
    role: "Command Anchor"
    description: "Local hardware interface (VS Code); operator terminal and execution context."
    location: "Local Hardware"
    authority: "User / Sovereign Interface"

polyglot_agents:
