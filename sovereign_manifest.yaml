auth:
  token_env_keys:
    tier1: ["AXIOM_TOKEN", "VIGIL_TOKEN", "ATLAS_TOKEN"]
    agents: [
      "QUARK_TOKEN", "FORGE_TOKEN", "SCRIBE_TOKEN",
      "AEGIS_TOKEN", "HELIX_TOKEN", "PULSE_TOKEN",
      "LATTICE_TOKEN", "STRATA_TOKEN", "CHORUS_TOKEN"
    ]
  notes: "All tokens must be set in environment; escalation to Sarah Prime for high-risk ops."

persistence:
  firebase: "Beta Node alias set"
  local: "store manifests under 05_THE_CORE/"
  nodes:
    alpha: "GitHub repository (canonical)"
    beta: "Firebase Realtime Database (/beta_node/manifests/)"
    delta: "Local filesystem (04_THE_MEMORY/)"
